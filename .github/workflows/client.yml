name: axochat-client

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  release:
    types: [published]

jobs:
  build:
    # releases of the server do not publish the client
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'client-v')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Publish snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          MAVEN_TOKEN_NAME: ${{ secrets.MAVEN_TOKEN_NAME }}
          MAVEN_TOKEN_SECRET: ${{ secrets.MAVEN_TOKEN_SECRET }}
        run: ./gradlew publish

      - name: Publish release
        if: github.event_name == 'release'
        env:
          MAVEN_TOKEN_NAME: ${{ secrets.MAVEN_TOKEN_NAME }}
          MAVEN_TOKEN_SECRET: ${{ secrets.MAVEN_TOKEN_SECRET }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew publish -PreleaseVersion="${TAG#client-v}"
