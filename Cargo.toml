[package]
name = "axochat"
version = "0.10.0"
authors = ["frozolotl <frozolotl@protonmail.com>"]
edition = "2018"
license = "MIT"

[features]
default = ["rustls-tls"]
rustls-tls = ["dep:rustls", "dep:rustls-pemfile", "actix-web/rustls"]
openssl-tls = ["dep:openssl", "actix-web/openssl"]

[dependencies]
log = "0.4"
env_logger = "0.10"
structopt = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
humantime = "2.1"
rand = "0.8"
rand_hc = "0.3"
uuid = { version = "1.3", features = ["serde", "v4"] }
derive_more = "0.99"
snafu = "0.7"

# Updated web framework and related dependencies
actix-web = { version = "4.3", features = ["cookies"] }
actix-web-actors = "4.2"
actix = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# Authentication
jsonwebtoken = "8.3"
ring = "0.16"

# TLS support
rustls = { version = "0.21", optional = true }
rustls-pemfile = { version = "1.0", optional = true }
openssl = { version = "0.10", features = ["v110"], optional = true }

# URLs
url = "2.3"
reqwest = { version = "0.11", features = ["json"] }
