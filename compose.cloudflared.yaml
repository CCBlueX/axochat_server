# Cloudflared-tunnel variant of compose.yaml for Docker Swarm (docker stack deploy):
# no published port, cloudflared reaches the chat over the stack overlay network.
# Label the target node first:  docker node update --label-add axochat=true <node>
services:
  axochat:
    image: registry.ccbluex.net/ccbluex/axochat-server:latest
    env_file: .env
    volumes:
      - data:/data
    networks:
      - internal
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      # A single replica: chat state lives in memory and bans in the node-local volume.
      replicas: 1
      placement:
        constraints:
          - node.labels.axochat == true
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARED_TOKEN:-}
    networks:
      - internal
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.axochat == true
      restart_policy:
        condition: any

volumes:
  data:

networks:
  internal:
    driver: overlay
